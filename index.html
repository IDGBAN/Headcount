<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follower ledger</title>
<style>
:root {
  --field: #0e141a;
  --panel: #141d25;
  --raised: #1a252f;
  --rule: #24333f;
  --ink: #dde6ee;
  --dim: #7b8fa1;
  --loss: #e07a63;
  --gain: #5fc0a3;
  --focus: #8fb8d8;

  --sans: ui-sans-serif, -apple-system, "Segoe UI Variable Text", "Segoe UI",
          Inter, Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas,
          "DejaVu Sans Mono", monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0 20px 72px;
  background: var(--field);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 820px; margin: 0 auto; }

header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 36px 0 20px;
  border-bottom: 1px solid var(--rule);
}

h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.meta {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
}

/* the reason the app exists gets the top slot */
.headline {
  padding: 26px 0 24px;
  border-bottom: 1px solid var(--rule);
  font-size: 19px;
  line-height: 1.6;
  letter-spacing: -0.01em;
}

.headline .quiet { color: var(--dim); }
.headline .loss { color: var(--loss); }
.headline .gain { color: var(--gain); }

.handle-inline {
  font-family: var(--mono);
  font-size: 0.85em;
  color: inherit;
  text-decoration: none;
  border-bottom: 1px solid currentColor;
  padding-bottom: 1px;
}
.handle-inline:hover { opacity: 0.7; }

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  margin: 20px 0 28px;
}

.stat {
  flex: 1 1 120px;
  background: var(--panel);
  padding: 14px 16px;
}
.stat:first-child { border-radius: 3px 0 0 3px; }
.stat:last-child  { border-radius: 0 3px 3px 0; }

.stat b {
  display: block;
  font-size: 24px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.stat span {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--dim);
}

.controls {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 4px;
}

.tabs {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tabs button {
  flex: 0 0 auto;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--dim);
  font: inherit;
  font-size: 14px;
  padding: 8px 12px;
  cursor: pointer;
  white-space: nowrap;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] {
  color: var(--ink);
  border-bottom-color: var(--focus);
}
.tabs button .count {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--dim);
  margin-left: 6px;
  font-variant-numeric: tabular-nums;
}

#search {
  flex: 1 1 180px;
  min-width: 140px;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 3px;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 13px;
  padding: 7px 10px;
}
#search::placeholder { color: var(--dim); }

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.list { margin-top: 18px; }

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 14px;
  border-left: 2px solid var(--rule);
  border-radius: 0 3px 3px 0;
  background: var(--panel);
  margin-bottom: 2px;
  text-decoration: none;
  color: var(--ink);
}
.row:hover { background: var(--raised); }
.row.loss { border-left-color: var(--loss); }
.row.gain { border-left-color: var(--gain); }

.row .handle {
  font-family: var(--mono);
  font-size: 13.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.row .go {
  font-size: 11px;
  color: var(--dim);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  flex: 0 0 auto;
  opacity: 0;
}
.row:hover .go { opacity: 1; }

.entry { margin-bottom: 26px; }

.entry h2 {
  margin: 0 0 10px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 400;
  color: var(--dim);
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
}

.group { margin-bottom: 10px; }

.group h3 {
  margin: 0 0 5px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--dim);
}
.group.loss h3 { color: var(--loss); }
.group.gain h3 { color: var(--gain); }

.empty {
  padding: 44px 0;
  color: var(--dim);
  text-align: center;
}
.empty code {
  display: inline-block;
  margin-top: 10px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--ink);
  background: var(--panel);
  padding: 8px 12px;
  border-radius: 3px;
}

@media (prefers-reduced-motion: no-preference) {
  .row, .entry {
    animation: rise 260ms cubic-bezier(0.2, 0.7, 0.3, 1) backwards;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
  }
}

@media (max-width: 560px) {
  .stat { flex-basis: 45%; border-radius: 3px !important; }
  .headline { font-size: 17px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Follower ledger</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div id="app"></div>
</div>

<script>
const TABS = [
  { key: "not_following_back", label: "Doesn't follow back", tone: "loss" },
  { key: "not_followed_back",  label: "You don't follow back", tone: "" },
  { key: "timeline",           label: "Changes", tone: "" },
];

const state = { data: null, tab: TABS[0].key, query: "" };

const app = document.getElementById("app");
const meta = document.getElementById("meta");

const escape = (value) => String(value).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const day = (stamp) => new Date(stamp).toLocaleDateString(undefined,
  { month: "short", day: "numeric" });

const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

function inlineHandles(accounts, tone, limit = 4) {
  const shown = accounts.slice(0, limit).map((a) =>
    `<a class="handle-inline" href="${escape(a.href)}" target="_blank" rel="noreferrer">@${escape(a.username)}</a>`
  ).join(" ");
  const rest = accounts.length - limit;
  return `<span class="${tone}">${shown}${rest > 0 ? ` <span class="quiet">+${rest} more</span>` : ""}</span>`;
}

function headline(data) {
  const change = data.since_last;
  if (!change) {
    return `<div class="headline"><span class="quiet">First snapshot saved.
      Ingest another export later and this is where departures show up.</span></div>`;
  }

  const parts = [];
  const gone = change.lost_followers.length;
  if (gone) {
    parts.push(`<span class="loss">${gone === 1 ? "1 person" : gone + " people"}</span>
      unfollowed you — ${inlineHandles(change.lost_followers, "loss")}`);
  }
  if (change.new_followers.length) {
    parts.push(`<span class="gain">${plural(change.new_followers.length, "new follower")}</span> —
      ${inlineHandles(change.new_followers, "gain")}`);
  }

  const body = parts.length
    ? parts.join(`<span class="quiet"> · </span>`)
    : `<span class="quiet">Nobody came or went.</span>`;

  return `<div class="headline">
    <span class="quiet">Since ${escape(day(change.from))} —</span> ${body}
  </div>`;
}

function stats(data) {
  const cells = [
    ["Followers", data.totals.followers],
    ["Following", data.totals.following],
    ["Mutuals", data.totals.mutuals],
    ["Doesn't follow back", data.not_following_back.length],
  ];
  return `<div class="stats">${cells.map(([label, value]) =>
    `<div class="stat"><b>${value}</b><span>${label}</span></div>`).join("")}</div>`;
}

function controls(data) {
  const buttons = TABS.map((tab) => {
    const count = tab.key === "timeline" ? data.timeline.length : data[tab.key].length;
    return `<button role="tab" data-tab="${tab.key}"
      aria-selected="${state.tab === tab.key}">${tab.label}<span class="count">${count}</span></button>`;
  }).join("");

  return `<div class="controls">
    <div class="tabs" role="tablist">${buttons}</div>
    <input id="search" type="search" placeholder="filter handles"
      value="${escape(state.query)}" autocomplete="off">
  </div>`;
}

function rows(accounts, tone) {
  if (!accounts.length) {
    return `<div class="empty">Nothing here.</div>`;
  }
  return `<div class="list">${accounts.map((account, index) =>
    `<a class="row ${tone}" href="${escape(account.href)}" target="_blank" rel="noreferrer"
        style="animation-delay:${Math.min(index, 14) * 14}ms">
      <span class="handle">@${escape(account.username)}</span>
      <span class="go">open</span>
    </a>`).join("")}</div>`;
}

function timeline(entries) {
  const groups = [
    ["lost_followers", "Unfollowed you", "loss"],
    ["new_followers", "Started following you", "gain"],
    ["you_unfollowed", "You unfollowed", ""],
    ["you_followed", "You started following", ""],
  ];

  const visible = entries.filter((entry) =>
    groups.some(([key]) => filter(entry[key]).length));

  if (!visible.length) {
    return `<div class="empty">No changes recorded yet.</div>`;
  }

  return visible.map((entry, index) => {
    const body = groups.map(([key, label, tone]) => {
      const accounts = filter(entry[key]);
      if (!accounts.length) return "";
      return `<div class="group ${tone}"><h3>${label} (${accounts.length})</h3>
        ${rows(accounts, tone)}</div>`;
    }).join("");

    return `<div class="entry" style="animation-delay:${Math.min(index, 10) * 30}ms">
      <h2>${escape(day(entry.from))} &rarr; ${escape(day(entry.to))}</h2>${body}</div>`;
  }).join("");
}

function filter(accounts) {
  const query = state.query.trim().toLowerCase().replace(/^@/, "");
  return query ? accounts.filter((a) => a.username.includes(query)) : accounts;
}

function render() {
  const data = state.data;

  if (!data || !data.snapshot_count) {
    meta.textContent = "";
    app.innerHTML = `<div class="empty">No snapshots yet.
      Request your data export in JSON format, then run:<br><code>python track.py ingest export.zip</code></div>`;
    return;
  }

  meta.textContent = `${day(data.taken_at)} · ${plural(data.snapshot_count, "snapshot")}`;

  const panel = state.tab === "timeline"
    ? timeline(data.timeline)
    : rows(filter(data[state.tab]), TABS.find((t) => t.key === state.tab).tone);

  app.innerHTML = headline(data) + stats(data) + controls(data) + panel;

  app.querySelectorAll("[data-tab]").forEach((button) => {
    button.addEventListener("click", () => {
      state.tab = button.dataset.tab;
      render();
    });
  });

  const search = document.getElementById("search");
  search.addEventListener("input", (event) => {
    state.query = event.target.value;
    const active = document.activeElement === search;
    render();
    if (active) {
      const next = document.getElementById("search");
      next.focus();
      next.setSelectionRange(next.value.length, next.value.length);
    }
  });
}

fetch("/api/data")
  .then((response) => response.json())
  .then((data) => { state.data = data; render(); })
  .catch(() => {
    app.innerHTML = `<div class="empty">Couldn't reach the local server.
      Make sure <code>python track.py serve</code> is still running.</div>`;
  });
</script>
</body>
</html>
